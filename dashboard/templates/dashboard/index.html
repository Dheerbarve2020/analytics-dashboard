<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Analytics Dashboard</title>
    <!-- Chart.js -->
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Analytics Dashboard</h1>
            <button id="logoutBtn" class="hidden">Logout</button>
        </header>

        <!-- Authentication Section -->
        <section id="auth-section" class="auth-container">
            <div class="card">
                <h2>Login</h2>
                <form id="loginForm" method="POST" action="{% url 'token_obtain_pair' %}">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" name="username" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" required>
                    </div>
                    <button type="submit">Login</button>
                </form>
            </div>


        </section>

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="hidden">
            <div class="card">
                <h3>Filters</h3>
                <div class="filters-bar">
                    <div class="form-group" style="flex-grow: 1; min-width: 250px;">
                        <label>Date Range</label>
                        <div id="reportrange" class="date-range-picker">
                            <i class="fa fa-calendar"></i>&nbsp;
                            <span></span> <i class="fa fa-caret-down"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Age Group</label>
                        <select id="filterAge">
                            <option value="">All</option>
                            <option value="<18">&lt; 18</option>
                            <option value="18-40">18 - 40</option>
                            <option value=">40">&gt; 40</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select id="filterGender">
                            <option value="">All</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="card">
                    <h3>Feature Usage</h3>
                    <div class="chart-container">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h3>Engagement Trend</h3>
                    <div class="chart-container">
                        <canvas id="lineChart"></canvas>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="/static/js/app.js"></script>
</body>

</html>
